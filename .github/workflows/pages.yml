name: Test, build and package
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: npm run build
      - uses: actions/upload-artifact@v4
        with:
          name: website-offline-and-vscode-extension
          path: dist
      - uses: actions/upload-pages-artifact@v3
        if: vars.ENABLE_GITHUB_PAGES == 'true' && github.event_name != 'pull_request'
        with:
          path: dist
  deploy:
    if: vars.ENABLE_GITHUB_PAGES == 'true' && github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@v5
        id: deployment
